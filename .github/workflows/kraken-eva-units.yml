name: Kraken matched EVA unit experiment
on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - 'research_gpt6/code/eva_unit_tools.py'
      - 'research_gpt6/code/kraken_eva_units.py'
      - 'research_gpt6/code/test_eva_unit_tools.py'
      - 'research_gpt6/data/kraken_eva_units_plan.json'
      - '.github/workflows/kraken-eva-units.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [reset_letters, reset_groups]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU recognition environment
        run: |
          python -m pip install 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kraken==7.1' 'lightning==2.6.1' 'pillow==12.3.0' 'numpy==2.4.6' 'scipy==1.15.3'
          python -m pip check
      - name: Check reversible units and physical separation
        run: |
          python research_gpt6/code/test_eva_unit_tools.py
          python research_gpt6/code/test_kraken_expansion_controls.py
      - name: Reset matched output layer and train fixed final epoch
        run: |
          python research_gpt6/code/kraken_eva_units.py train \
            --plan research_gpt6/data/kraken_eva_units_plan.json --repo research_gpt6 \
            --variant '${{ matrix.variant }}' --out 'work/eva_units/${{ matrix.variant }}'
      - name: Preserve outcomes and failures without duplicate crop images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-unit-${{ matrix.variant }}
          path: |
            work/eva_units/${{ matrix.variant }}/
            !work/eva_units/${{ matrix.variant }}/training_images/**
          if-no-files-found: warn
          retention-days: 30
  evaluate:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install identical fixed CPU environment
        run: |
          python -m pip install 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kraken==7.1' 'lightning==2.6.1' 'pillow==12.3.0' 'numpy==2.4.6' 'scipy==1.15.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: eva-unit-*
          path: work/trained
      - name: Compare source and both new models twice in one process
        run: |
          python research_gpt6/code/kraken_eva_units.py evaluate \
            --plan research_gpt6/data/kraken_eva_units_plan.json --repo research_gpt6 \
            --runs work/trained --out work/eva_unit_evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eva-unit-common-evaluation
          path: work/eva_unit_evaluation/
          if-no-files-found: warn
          retention-days: 30
