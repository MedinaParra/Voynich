name: TimesFM Q13 singulion order

on:
  push:
    branches:
      - experiment/timesfm-voynich
    paths:
      - 'research_gpt6/code/timesfm_singulion_q13.py'
      - '.github/workflows/timesfm-singulion-q13.yml'
  workflow_dispatch:

jobs:
  timesfm-q13-order:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen TimesFM runtime
        run: pip install 'timesfm[torch]==3.0.2'
      - name: Fetch frozen EVA corpus
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt' \
            -o /tmp/voynich_eva.txt
      - name: Execute TimesFM Q13 order test
        run: |
          python research_gpt6/code/timesfm_singulion_q13.py \
            --corpus /tmp/voynich_eva.txt \
            --out research_gpt6/results/timesfm_singulion_q13.json \
            --context 64 --horizon 4 \
            | tee /tmp/timesfm-q13.log
      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timesfm-singulion-q13-result
          path: research_gpt6/results/timesfm_singulion_q13.json
          if-no-files-found: warn
