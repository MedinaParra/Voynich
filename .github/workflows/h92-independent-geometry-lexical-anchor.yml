name: H92 independent geometry lexical-anchor replication
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/code/h92_independent_geometry_lexical_anchor.py'
      - '.github/workflows/h92-independent-geometry-lexical-anchor.yml'
jobs:
  h92:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow scipy
      - name: Run preregistered H92 independent replication
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h92_independent_geometry_lexical_anchor.py --out research_gpt6/results/h92_independent_geometry_lexical_anchor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h92-independent-geometry-lexical-anchor
          path: research_gpt6/results/h92_independent_geometry_lexical_anchor.json
          if-no-files-found: error
