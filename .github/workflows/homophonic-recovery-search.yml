name: Blinded homophonic recovery search
on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - .github/workflows/homophonic-recovery-search.yml
      - research_gpt6/results/homophonic_recovery/public/ciphertexts.json
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5
      - name: Compile fixed solvers and check objective deltas
        run: |
          g++ -O3 -std=c++17 research_gpt6/code/known_substitution_solver.cpp -o /tmp/bijective_solver
          g++ -O3 -std=c++17 research_gpt6/code/homophonic_solver.cpp -o /tmp/homophonic_solver
          /tmp/homophonic_solver --self-test
          python -m py_compile research_gpt6/code/run_homophonic_recovery.py research_gpt6/code/prepare_mapping_freedom_packet.py research_gpt6/code/evaluate_mapping_freedom_packet.py research_gpt6/code/audit_homophonic_recovery.py
          python research_gpt6/code/audit_homophonic_recovery.py --controls-only
      - name: Search public cases without reveal inputs
        run: |
          test ! -e research_gpt6/results/homophonic_recovery/reveal/truth.json
          python research_gpt6/code/run_homophonic_recovery.py --repo research_gpt6 --bundle research_gpt6/results/homophonic_recovery --bijective /tmp/bijective_solver --many-to-one /tmp/homophonic_solver --out work/homophonic_search
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homophonic-search-before-reveal
          path: |
            work/homophonic_search/predictions.json
            work/homophonic_search/execution.json
          retention-days: 30
