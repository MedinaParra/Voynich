name: H105 Rosettes spatial lexical anchor
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/code/h105_rosettes_spatial_lexical_anchor.py'
      - 'research_gpt6/156_h105_rosettes_spatial_lexical_anchor_preregistration.md'
      - '.github/workflows/h105-rosettes-spatial-lexical-anchor.yml'
jobs:
  h105:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Fetch frozen positioned Rosettes data
        run: |
          curl -L --fail -o tokens_f85v_86r.csv 'https://raw.githubusercontent.com/alessandroplaca-uro/voynich-spatial-data/7580dafa624cf23a63665f4819022003f8d128ef/rosettes/tokens_f85v_86r.csv'
          test -s tokens_f85v_86r.csv
      - name: Run preregistered H105
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h105_rosettes_spatial_lexical_anchor.py --csv tokens_f85v_86r.csv --out research_gpt6/results/h105_rosettes_spatial_lexical_anchor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h105-rosettes-spatial-lexical-anchor
          path: research_gpt6/results/h105_rosettes_spatial_lexical_anchor.json
          if-no-files-found: error
