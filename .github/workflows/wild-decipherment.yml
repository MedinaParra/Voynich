name: Voynich wild decipherment
on:
  workflow_dispatch:
  push:
    branches: [experiment/wild-decipherment]
    paths: ['research_gpt6/code/wild_candidate_dictionary.py','research_gpt6/code/morpheme_role_audit.py','research_gpt6/code/compositional_morpheme_audit.py','research_gpt6/code/compositional_holdout_audit.py','research_gpt6/code/regime_compositional_audit.py','research_gpt6/code/adversarial_compositional_null.py','research_gpt6/code/label_pair_anchor_audit.py','research_gpt6/code/ls_lz_folio_null.py','research_gpt6/38_adversarial_null_protocol.md','research_gpt6/39_label_pair_anchor_protocol.md','research_gpt6/40_ls_lz_folio_null_protocol.md','.github/workflows/wild-decipherment.yml']
jobs:
  morphology-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Acquire frozen IVTFF corpus
        run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Generate candidate dictionary
        run: mkdir -p research_gpt6/results && python research_gpt6/code/wild_candidate_dictionary.py --corpus voynich_eva.txt --out research_gpt6/results/wild_candidate_dictionary.json --min-count 8
      - name: Audit morpheme positional roles
        run: python research_gpt6/code/morpheme_role_audit.py --corpus voynich_eva.txt --out research_gpt6/results/morpheme_role_audit.json --min 25
      - name: Test compositional prefix effects
        run: python research_gpt6/code/compositional_morpheme_audit.py --corpus voynich_eva.txt --out research_gpt6/results/compositional_morpheme_audit.json --min-pair 4
      - name: Adversarial folio holdout
        run: python research_gpt6/code/compositional_holdout_audit.py --corpus voynich_eva.txt --out research_gpt6/results/compositional_holdout_audit.json --min-train 3 --min-test 2
      - name: Control compositionality within manuscript regimes
        run: python research_gpt6/code/regime_compositional_audit.py --corpus voynich_eva.txt --out research_gpt6/results/regime_compositional_audit.json --min-form 2 --min-stems 3
      - name: Preregistered adversarial permutation null
        run: python research_gpt6/code/adversarial_compositional_null.py --corpus voynich_eva.txt --out research_gpt6/results/adversarial_compositional_null.json --permutations 999
      - name: Confound-matched label pair lexical anchor audit
        run: python research_gpt6/code/label_pair_anchor_audit.py --corpus voynich_eva.txt --out research_gpt6/results/label_pair_anchor_audit.json --permutations 999
      - name: Folio-level Ls/Lz confound null
        run: python research_gpt6/code/ls_lz_folio_null.py --corpus voynich_eva.txt --out research_gpt6/results/ls_lz_folio_null.json --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wild-decipherment-results
          path: research_gpt6/results/*.json
          if-no-files-found: warn