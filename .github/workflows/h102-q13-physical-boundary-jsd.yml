name: H102 Q13 physical-boundary JSD
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/code/h102_q13_physical_boundary_jsd.py'
      - '.github/workflows/h102-q13-physical-boundary-jsd.yml'
jobs:
  h102:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Fetch frozen Takahashi transcription
        run: curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H102
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h102_q13_physical_boundary_jsd.py --takahashi IT2a-n.txt --out research_gpt6/results/h102_q13_physical_boundary_jsd.json
          cat research_gpt6/results/h102_q13_physical_boundary_jsd.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h102-q13-physical-boundary-jsd
          path: research_gpt6/results/h102_q13_physical_boundary_jsd.json
          if-no-files-found: error
