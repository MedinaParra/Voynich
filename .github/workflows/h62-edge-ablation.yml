name: Voynich H62 edge-ablation replication
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/65_h62_edge_ablation_preregistration.md'
      - 'research_gpt6/code/edge_ablation_h62.py'
      - '.github/workflows/h62-edge-ablation.yml'
jobs:
  edge-ablation-h62:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Acquire frozen primary IVTFF corpus
        run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Acquire frozen independent Takahashi transcription
        run: curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run frozen H62 edge-ablation replication
        run: mkdir -p research_gpt6/results && python research_gpt6/code/edge_ablation_h62.py --primary voynich_eva.txt --independent IT2a-n.txt --out research_gpt6/results/edge_ablation_h62.json --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-ablation-h62-results
          path: research_gpt6/results/edge_ablation_h62.json
          if-no-files-found: error
