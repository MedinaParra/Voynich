name: H73 Q13 reported singulion permutation
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/88_h73_q13_reported_singulion_permutation_preregistration.md'
      - 'research_gpt6/code/h73_q13_reported_singulion_permutation.py'
      - '.github/workflows/h73-q13-reported-singulion-permutation.yml'

jobs:
  h73-q13-reported-singulion-permutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen ZL corpus
        run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Fetch frozen Takahashi corpus
        run: curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H73 Q13 exact permutation test
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h73_q13_reported_singulion_permutation.py --zl voynich_eva.txt --takahashi IT2a-n.txt --out research_gpt6/results/h73_q13_reported_singulion_permutation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h73-q13-reported-singulion-permutation-results
          path: research_gpt6/results/h73_q13_reported_singulion_permutation.json
          if-no-files-found: error
