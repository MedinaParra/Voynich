name: Alien protocol diagnostic and semantic ambiguity
on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - .github/workflows/alien-protocol.yml
      - research_gpt6/code/alien_protocol_data.py
      - research_gpt6/code/alien_protocol_probe.py
      - research_gpt6/code/audit_alien_protocol.py
      - research_gpt6/data/alien_protocol_plan.json
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Verify published input and implementation freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('research_gpt6/data/alien_protocol_freeze.json')
          for r in json.loads(p.read_text())['files']:
              assert hashlib.sha256(Path(r['path']).read_bytes()).hexdigest()==r['sha256'],r['path']
          print('ALIEN_PROTOCOL_PRE_EXECUTION_FILES_IDENTICAL')
          PY
      - name: Execute all fixed projections and controls
        run: python research_gpt6/code/alien_protocol_probe.py --repo research_gpt6 --plan research_gpt6/data/alien_protocol_plan.json --out work/alien_protocol
      - name: Independently audit witnesses and normalized models
        run: python research_gpt6/code/audit_alien_protocol.py --bundle work/alien_protocol --out work/alien_protocol/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alien-protocol-results
          path: work/alien_protocol
          retention-days: 30
