name: H86 triangular label stability replication

on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/**'
      - '.github/workflows/h86-triangular-label-stability-replication.yml'

permissions:
  contents: read

jobs:
  h86-triangular-label-stability-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen ZL, IT and GC transcription sources
        run: |
          curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
          base='https://raw.githubusercontent.com/noah-chelednik/voynich-data/472ef7366606a799fc8f1044c037e06b413f6ddd/data_sources/cache'
          curl -L --fail -o IT_ivtff_1a.txt "$base/IT_ivtff_1a.txt"
          curl -L --fail -o GC2a-n.txt "$base/GC2a-n.txt"
      - name: Run preregistered H86 triangular replication
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h86_triangular_label_stability_replication.py \
            --zl voynich_eva.txt \
            --it IT_ivtff_1a.txt \
            --gc GC2a-n.txt \
            --out research_gpt6/results/h86_triangular_label_stability_replication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h86-triangular-label-stability-replication-results
          path: research_gpt6/results/h86_triangular_label_stability_replication.json
          if-no-files-found: error
