name: Q20 ordering benchmark

on:
  push:
    branches:
      - research/gpt6-audit
    paths:
      - '.github/workflows/q20-order.yml'
      - 'research_gpt6/code/order_q20_openpath.py'
      - 'research_gpt6/code/order_q20_controls.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q20-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/gpt6-audit
          fetch-depth: 0

      - name: Fetch frozen ZL3b corpus
        run: |
          git clone https://github.com/cesarjz/Voynich.git /tmp/voynich-corpus
          cd /tmp/voynich-corpus
          git checkout 47e6a77dc9d5cd570c375f4aff710fa4a0567278
          test "$(git rev-parse HEAD)" = "47e6a77dc9d5cd570c375f4aff710fa4a0567278"

      - name: Run exhaustive Q20 benchmark
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/order_q20_openpath.py \
            /tmp/voynich-corpus/corpus/voynich_eva.txt \
            --json research_gpt6/results/q20_order.json \
            > research_gpt6/results/q20_order.stdout.json

      - name: Run Q20 dialect-confound controls
        run: |
          python research_gpt6/code/order_q20_controls.py \
            /tmp/voynich-corpus/corpus/voynich_eva.txt \
            --json research_gpt6/results/q20_order_controls.json \
            > research_gpt6/results/q20_order_controls.stdout.json

      - name: Record provenance
        run: |
          {
            echo "workflow_commit=$(git rev-parse HEAD)"
            echo "corpus_commit=47e6a77dc9d5cd570c375f4aff710fa4a0567278"
            echo "python=$(python --version 2>&1)"
            sha256sum /tmp/voynich-corpus/corpus/voynich_eva.txt
            sha256sum research_gpt6/code/order_q20_openpath.py
            sha256sum research_gpt6/code/order_q20_controls.py
          } > research_gpt6/results/q20_order_provenance.txt

      - name: Commit benchmark output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_gpt6/results/q20_order.json \
                  research_gpt6/results/q20_order.stdout.json \
                  research_gpt6/results/q20_order_controls.json \
                  research_gpt6/results/q20_order_controls.stdout.json \
                  research_gpt6/results/q20_order_provenance.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: record dialect-controlled Q20 ordering benchmark"
            git push origin HEAD:research/gpt6-audit
          fi
