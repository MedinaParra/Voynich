name: H94 initial-glyph visual anchor
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/code/h94_initial_glyph_visual_anchor.py'
      - '.github/workflows/h94-initial-glyph-visual-anchor.yml'
jobs:
  h94:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow scipy scikit-learn
      - name: Run preregistered H94 confirmatory test
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h94_initial_glyph_visual_anchor.py --out research_gpt6/results/h94_initial_glyph_visual_anchor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h94-initial-glyph-visual-anchor
          path: research_gpt6/results/h94_initial_glyph_visual_anchor.json
          if-no-files-found: error
