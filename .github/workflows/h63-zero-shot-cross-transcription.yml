name: H63 zero-shot cross-transcription
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/**'
      - '.github/workflows/h63-zero-shot-cross-transcription.yml'

jobs:
  h63-zero-shot-cross-transcription:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen ZL discovery corpus
        run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Fetch frozen Takahashi replication corpus
        run: curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H63 zero-shot transfer
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h63_zero_shot_cross_transcription.py --discovery voynich_eva.txt --replication IT2a-n.txt --out research_gpt6/results/h63_zero_shot_cross_transcription.json --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h63-zero-shot-cross-transcription-results
          path: research_gpt6/results/h63_zero_shot_cross_transcription.json
          if-no-files-found: error
