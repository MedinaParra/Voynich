name: Kraken frozen CTC posterior decoding
on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - 'research_gpt6/code/ctc_prefix_tools.py'
      - 'research_gpt6/code/test_ctc_prefix_tools.py'
      - 'research_gpt6/code/kraken_ctc_posterior.py'
      - 'research_gpt6/data/kraken_ctc_posterior_plan.json'
      - '.github/workflows/kraken-ctc-posterior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU recognition environment
        run: |
          python -m pip install 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kraken==7.1' 'lightning==2.6.1' 'pillow==12.3.0' 'numpy==2.4.6' 'scipy==1.15.3'
      - name: Check CTC mathematics against exhaustive tiny examples
        run: python research_gpt6/code/test_ctc_prefix_tools.py
      - name: Capture original posteriors, require parity, compare fixed searches
        run: python research_gpt6/code/kraken_ctc_posterior.py --plan research_gpt6/data/kraken_ctc_posterior_plan.json --repo research_gpt6 --out work/ctc_posterior
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-ctc-posterior
          path: work/ctc_posterior/
          if-no-files-found: warn
          retention-days: 30
