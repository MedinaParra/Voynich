name: Kraken region assembly and conditional OCR

on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - 'research_gpt6/code/kraken_row_tools.py'
      - 'research_gpt6/code/kraken_stage2.py'
      - 'research_gpt6/code/test_kraken_stage2.py'
      - 'research_gpt6/data/kraken_stage2_plan.json'
      - 'research_gpt6/data/kraken_region_masks.json'
      - 'research_gpt6/data/kraken_line_reference.json'
      - '.github/workflows/kraken-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'kraken==7.1'
          python -m pip check
      - name: Compile and run scientific failure controls
        run: |
          python -m py_compile research_gpt6/code/kraken_row_tools.py research_gpt6/code/kraken_stage2.py
          python research_gpt6/code/test_kraken_stage2.py
      - name: Execute frozen layout and first recognizer
        run: |
          python research_gpt6/code/kraken_stage2.py \
            --plan research_gpt6/data/kraken_stage2_plan.json \
            --masks research_gpt6/data/kraken_region_masks.json \
            --reference research_gpt6/data/kraken_line_reference.json \
            --out research_gpt6/results/kraken_stage2
      - name: Preserve complete evidence and trained model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-stage2-full-evidence
          path: research_gpt6/results/kraken_stage2/
          if-no-files-found: warn
          retention-days: 30
