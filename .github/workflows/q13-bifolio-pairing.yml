name: Q13 exact bifolio pairing test

on:
  push:
    branches:
      - experiment/q13-bifolio-pairing-final
    paths:
      - 'research_gpt6/code/q13_bifolio_pairing_exact.py'
      - 'research_gpt6/code/q13_bifolio_pairing_distance_adjusted.py'
      - '.github/workflows/q13-bifolio-pairing.yml'
  workflow_dispatch:

jobs:
  exact-pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen EVA corpus
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt' \
            -o /tmp/voynich_eva.txt
      - name: Execute exact 945-matching tournament
        run: |
          python research_gpt6/code/q13_bifolio_pairing_exact.py \
            --corpus /tmp/voynich_eva.txt \
            --out research_gpt6/results/q13_bifolio_pairing_exact.json \
            | tee /tmp/q13-pairing.log
      - name: Execute distance-adjusted tournament
        run: |
          python research_gpt6/code/q13_bifolio_pairing_distance_adjusted.py \
            --corpus /tmp/voynich_eva.txt \
            --out research_gpt6/results/q13_bifolio_pairing_distance_adjusted.json \
            | tee /tmp/q13-pairing-distance-adjusted.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: q13-bifolio-pairing-results
          path: |
            research_gpt6/results/q13_bifolio_pairing_exact.json
            research_gpt6/results/q13_bifolio_pairing_distance_adjusted.json
