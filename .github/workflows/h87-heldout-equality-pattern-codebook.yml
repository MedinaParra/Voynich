name: H87 held-out equality-pattern codebook

on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/**'
      - '.github/workflows/h87-heldout-equality-pattern-codebook.yml'

permissions:
  contents: read

jobs:
  h87-heldout-equality-pattern-codebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen ZL and Takahashi sources
        run: |
          curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
          curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H87 codebook test
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h87_heldout_equality_pattern_codebook.py \
            --zl voynich_eva.txt \
            --takahashi IT2a-n.txt \
            --out research_gpt6/results/h87_heldout_equality_pattern_codebook.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h87-heldout-equality-pattern-codebook-results
          path: research_gpt6/results/h87_heldout_equality_pattern_codebook.json
          if-no-files-found: error
