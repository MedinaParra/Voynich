name: Kraken matched spatial perturbation retraining
on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - 'research_gpt6/code/shared_region_tools.py'
      - 'research_gpt6/code/test_shared_region_tools.py'
      - 'research_gpt6/code/kraken_shared_region.py'
      - 'research_gpt6/code/prepare_shared_fresh.py'
      - 'research_gpt6/data/kraken_shared_region_plan.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [repeat, random_ink, shared_ink]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU recognition environment
        run: |
          python -m pip install 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kraken==7.1' 'lightning==2.6.1' 'pillow==12.3.0' 'numpy==2.4.6' 'scipy==1.15.3'
          python -m pip check
      - name: Check intervention invariants and physical separation
        run: python research_gpt6/code/test_shared_region_tools.py
      - name: Train the fixed two-view condition
        run: |
          python research_gpt6/code/kraken_shared_region.py train --plan research_gpt6/data/kraken_shared_region_plan.json --repo research_gpt6 --variant '${{ matrix.variant }}' --out 'work/shared_region/${{ matrix.variant }}'
      - name: Preserve models and evidence without duplicate training PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-region-${{ matrix.variant }}
          path: |
            work/shared_region/${{ matrix.variant }}/
            !work/shared_region/${{ matrix.variant }}/training_images/**
          if-no-files-found: warn
          retention-days: 30
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the unchanged geometric registration environment
        run: python -m pip install 'opencv-python-headless==4.12.0.88' 'numpy==2.2.6' 'pillow==12.3.0' 'scipy==1.15.3'
      - name: Acquire only fixed leaf8 and preserve all geometric decisions
        run: python research_gpt6/code/prepare_shared_fresh.py --plan research_gpt6/data/kraken_shared_region_plan.json --repo research_gpt6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-leaf8-geometry
          path: research_gpt6/results/kraken_shared_region/fresh_data/
          if-no-files-found: warn
          retention-days: 30
  evaluate:
    needs: [train, fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same fixed CPU recognition environment
        run: |
          python -m pip install 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kraken==7.1' 'lightning==2.6.1' 'pillow==12.3.0' 'numpy==2.4.6' 'scipy==1.15.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: shared-region-*
          path: work/shared_trained
      - uses: actions/download-artifact@v4
        with:
          name: fresh-leaf8-geometry
          path: research_gpt6/results/kraken_shared_region/fresh_data
      - name: Check beam mathematics before common evaluation
        run: python research_gpt6/code/test_ctc_prefix_tools.py
      - name: Compare all models twice on unchanged historical and fresh crops
        run: python research_gpt6/code/kraken_shared_region.py evaluate --plan research_gpt6/data/kraken_shared_region_plan.json --repo research_gpt6 --runs work/shared_trained --out work/shared_common_evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-region-common-evaluation
          path: work/shared_common_evaluation/
          if-no-files-found: warn
          retention-days: 30
