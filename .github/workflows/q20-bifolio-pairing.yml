name: Q20 bifolio pairing replication

on:
  push:
    branches:
      - experiment/q20-bifolio-pairing
    paths:
      - 'research_gpt6/code/q20_bifolio_pairing_replication.py'
      - '.github/workflows/q20-bifolio-pairing.yml'
  workflow_dispatch:

jobs:
  q20-pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen EVA corpus
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt' \
            -o /tmp/voynich_eva.txt
      - name: Execute Q20 10,395-matching replication
        run: |
          python research_gpt6/code/q20_bifolio_pairing_replication.py \
            --corpus /tmp/voynich_eva.txt \
            --out research_gpt6/results/q20_bifolio_pairing_replication.json \
            | tee /tmp/q20-pairing.log
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: q20-bifolio-pairing-replication
          path: research_gpt6/results/q20_bifolio_pairing_replication.json
