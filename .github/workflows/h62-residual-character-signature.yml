name: H62 residual character signature
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/70_h62_residual_character_signature_preregistration.md'
      - 'research_gpt6/code/residual_character_signature_h62.py'
      - '.github/workflows/h62-residual-character-signature.yml'
jobs:
  h62-residual-character-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Run preregistered H62 residual character signature
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/residual_character_signature_h62.py \
            --corpus voynich_eva.txt \
            --out research_gpt6/results/residual_character_signature_h62.json \
            --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h62-residual-character-signature-results
          path: research_gpt6/results/residual_character_signature_h62.json
          if-no-files-found: error
