name: H61 label cross-context
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/code/h61_label_cross_context.py'
      - 'research_gpt6/64_h61_label_cross_context_preregistration.md'
      - '.github/workflows/h61-label-cross-context.yml'

jobs:
  h61-label-cross-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen EVA corpus
        run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Run preregistered H61 cross-context test
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h61_label_cross_context.py --corpus voynich_eva.txt --out research_gpt6/results/h61_label_cross_context.json --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h61-label-cross-context-results
          path: research_gpt6/results/h61_label_cross_context.json
          if-no-files-found: error
