name: H64 replicated five-feature decomposition
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/74_h64_five_feature_decomposition_preregistration.md'
      - 'research_gpt6/code/five_feature_decomposition_h64.py'
      - '.github/workflows/h64-five-feature-decomposition.yml'
jobs:
  h64-five-feature-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: curl -L --fail -o source_a.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - run: curl -L --fail -o source_b.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H64 replicated five-feature decomposition
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/five_feature_decomposition_h64.py \
            --source-a source_a.txt \
            --source-b source_b.txt \
            --out research_gpt6/results/five_feature_decomposition_h64.json \
            --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h64-five-feature-decomposition-results
          path: research_gpt6/results/five_feature_decomposition_h64.json
          if-no-files-found: error
