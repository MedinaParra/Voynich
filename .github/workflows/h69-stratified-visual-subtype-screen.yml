name: H69 stratified visual-subtype screen
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/**'
      - '.github/workflows/h69-stratified-visual-subtype-screen.yml'

jobs:
  h69-stratified-visual-subtype-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen external IVTFF source
        run: curl -L --fail -o IT_ivtff_1a.txt 'https://raw.githubusercontent.com/noah-chelednik/voynich-data/472ef7366606a799fc8f1044c037e06b413f6ddd/data_sources/cache/IT_ivtff_1a.txt'
      - name: Run preregistered H69 subtype screen
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h69_stratified_visual_subtype_screen.py --source IT_ivtff_1a.txt --out research_gpt6/results/h69_stratified_visual_subtype_screen.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h69-stratified-visual-subtype-screen-results
          path: research_gpt6/results/h69_stratified_visual_subtype_screen.json
          if-no-files-found: error
