name: Voynichese to Yale geometric registration

on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - 'research_gpt6/code/register_voynichese_yale.py'
      - 'research_gpt6/code/test_register_voynichese_yale.py'
      - 'research_gpt6/data/voynichese_registration_plan.json'
      - 'research_gpt6/data/voynichese_registration_inputs.json'
      - 'research_gpt6/data/voynichese_registration_requirements.txt'
      - '.github/workflows/voynichese-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-and-coordinate-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed geometric environment
        run: |
          python -m pip install --disable-pip-version-check -r research_gpt6/data/voynichese_registration_requirements.txt
          python -m pip check
      - name: Run synthetic failure controls
        run: python research_gpt6/code/test_register_voynichese_yale.py
      - name: Attempt all four correct and twelve wrong image pairs
        run: |
          python research_gpt6/code/register_voynichese_yale.py \
            --plan research_gpt6/data/voynichese_registration_plan.json \
            --repo research_gpt6 \
            --out work/voynichese_registration
      - name: Preserve all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voynichese-registration
          path: work/voynichese_registration/
          if-no-files-found: warn
          retention-days: 30
