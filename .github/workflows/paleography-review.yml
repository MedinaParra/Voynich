name: Assisted paleography record and image replay
on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - .github/workflows/paleography-review.yml
      - research_gpt6/code/prepare_paleographic_review.py
      - research_gpt6/code/assemble_paleographic_review.py
      - research_gpt6/code/verify_paleographic_review.py
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0
      - name: Verify preserved original bytes and review schema
        run: python research_gpt6/code/verify_paleographic_review.py --repo research_gpt6 --bundle research_gpt6/results/assisted_paleography --out work/integrity.json
      - name: Rebuild presentation and assemble recorded observations
        run: |
          mkdir -p work/paleography/sources work/paleography/reviews
          cp research_gpt6/results/assisted_paleography/sources/* work/paleography/sources/
          cp research_gpt6/results/assisted_paleography/reviews/* work/paleography/reviews/
          python research_gpt6/code/prepare_paleographic_review.py --repo research_gpt6 --out work/paleography --blind work/blind_packet
          python research_gpt6/code/assemble_paleographic_review.py --repo research_gpt6 --out work/paleography
      - name: Compare image bytes and recorded interpretations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          original=Path('research_gpt6/results/assisted_paleography')
          replay=Path('work/paleography')
          for name in ['presentation_mapping.json','assessment.json','summary.json','proposals.json']:
              assert json.loads((original/name).read_text())==json.loads((replay/name).read_text()),name
          for name in ['form_comparison.jpg']+[f'blind_sheets/sheet_{i}.jpg' for i in range(1,7)]:
              assert (original/name).read_bytes()==(replay/name).read_bytes(),name
          expected=json.loads((original/'integrity.json').read_text())
          actual=json.loads(Path('work/integrity.json').read_text())
          assert expected==actual and actual['status']=='PASS'
          print('IDENTICAL_NATIVE_PIXEL_PRESENTATION_AND_RECORDED_AI_EDITORIAL_DATA; NO_PALEOGRAPHIC_VALIDATION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paleography-record-replay
          path: |
            work/integrity.json
            work/paleography/summary.json
          retention-days: 30
