# Trigger commit after initial workflow registration; no scientific criteria changed.
name: H76 visual-object extraction admissibility
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/94_h76_visual_object_extraction_admissibility_preregistration.md'
      - 'research_gpt6/code/h76_visual_object_extraction_admissibility.py'
      - '.github/workflows/h76-visual-object-extraction-admissibility.yml'

jobs:
  h76-visual-object-extraction-admissibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scipy
      - name: Fetch frozen Yale f68r1 coordinates
        run: curl -L --fail -o f68r1.json 'https://raw.githubusercontent.com/YaleDHLab/voynich/c4d36f4595292c92da8c7428e30cb23b700a019b/utils/voynichese/coords/f68r1.json'
      - name: Fetch frozen Yale f68r2 coordinates
        run: curl -L --fail -o f68r2.json 'https://raw.githubusercontent.com/YaleDHLab/voynich/c4d36f4595292c92da8c7428e30cb23b700a019b/utils/voynichese/coords/f68r2.json'
      - name: Run preregistered H76 gate
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h76_visual_object_extraction_admissibility.py --coords-f68r1 f68r1.json --coords-f68r2 f68r2.json --out research_gpt6/results/h76_visual_object_extraction_admissibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h76-visual-object-extraction-admissibility-results
          path: research_gpt6/results/h76_visual_object_extraction_admissibility.json
          if-no-files-found: error
