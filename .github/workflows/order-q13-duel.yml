name: Voynich Q13 sequence duel

on:
  push:
    branches:
      - research/gpt6-audit
    paths:
      - '.github/workflows/order-q13-duel.yml'
      - 'research_gpt6/code/order_q13_sequence_duel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q13-duel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/gpt6-audit
          fetch-depth: 0

      - name: Fetch frozen ZL3b corpus
        run: |
          git clone https://github.com/cesarjz/Voynich.git /tmp/voynich-corpus
          cd /tmp/voynich-corpus
          git checkout 47e6a77dc9d5cd570c375f4aff710fa4a0567278
          test "$(git rev-parse HEAD)" = "47e6a77dc9d5cd570c375f4aff710fa4a0567278"

      - name: Run Q13 sequence duel
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/order_q13_sequence_duel.py \
            /tmp/voynich-corpus/corpus/voynich_eva.txt \
            --reps 2000 --seed 20261007 \
            --json research_gpt6/results/order_q13_sequence_duel.json \
            > research_gpt6/results/order_q13_sequence_duel.stdout.json

      - name: Record provenance
        run: |
          {
            echo "workflow_commit=$(git rev-parse HEAD)"
            echo "corpus_commit=47e6a77dc9d5cd570c375f4aff710fa4a0567278"
            echo "python=$(python --version 2>&1)"
            sha256sum /tmp/voynich-corpus/corpus/voynich_eva.txt
            sha256sum research_gpt6/code/order_q13_sequence_duel.py
          } > research_gpt6/results/order_q13_sequence_duel_provenance.txt

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_gpt6/results/order_q13_sequence_duel.json \
                  research_gpt6/results/order_q13_sequence_duel.stdout.json \
                  research_gpt6/results/order_q13_sequence_duel_provenance.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: record direct Q13 sequence duel"
            git fetch origin research/gpt6-audit
            git rebase origin/research/gpt6-audit
            git push origin HEAD:research/gpt6-audit
          fi
