name: H90 f68r1 geometry lexical anchor
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/121_h90_f68r1_geometry_lexical_anchor_preregistration.md'
      - 'research_gpt6/code/h90_f68r1_geometry_lexical_anchor.py'
      - '.github/workflows/h90-f68r1-geometry-lexical-anchor.yml'
jobs:
  h90:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependency
        run: python -m pip install numpy
      - name: Fetch frozen inputs
        run: |
          curl -L --fail -o stars.csv 'https://raw.githubusercontent.com/seeton/Voynich-public/8920f2e506fce4c2c5a1245fb21a312f25655f1b/analysis/annotations/f68r_star_centres.csv'
          curl -L --fail -o f68r1.json 'https://raw.githubusercontent.com/YaleDHLab/voynich/c4d36f4595292c92da8c7428e30cb23b700a019b/utils/voynichese/coords/f68r1.json'
      - name: Run H90
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h90_f68r1_geometry_lexical_anchor.py --stars stars.csv --yale f68r1.json --out research_gpt6/results/h90_f68r1_geometry_lexical_anchor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h90-f68r1-geometry-lexical-anchor-results
          path: research_gpt6/results/h90_f68r1_geometry_lexical_anchor.json
          if-no-files-found: error
