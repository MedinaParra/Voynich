name: H96 generative cipher tournament
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/code/h96_*.py'
      - '.github/workflows/h96-generative-tournament.yml'
jobs:
  h96:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Fetch frozen Takahashi transcription
        run: curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H96 tournament
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h96_generative_tournament.py --takahashi IT2a-n.txt --out research_gpt6/results/h96_generative_tournament.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h96-generative-tournament
          path: research_gpt6/results/h96_generative_tournament.json
          if-no-files-found: error
