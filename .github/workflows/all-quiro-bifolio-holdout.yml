name: Held-out bifolio pairing across quires

on:
  push:
    branches:
      - experiment/all-quiro-bifolio-holdout
    paths:
      - 'research_gpt6/code/all_quires_bifolio_holdout.py'
      - 'research_gpt6/code/bifolio_blind_reconstruction.py'
      - 'research_gpt6/code/bifolio_hand_currier_control.py'
      - 'research_gpt6/code/it2a_blind_bifolio_replication.py'
      - 'research_gpt6/code/blind_reconstruction_metadata_conditional.py'
      - 'research_gpt6/code/bifolio_double_residual_reconstruction.py'
      - 'research_gpt6/code/bifolio_leave_one_quire_out.py'
      - 'research_gpt6/code/quire_c_signal_decomposition.py'
      - '.github/workflows/all-quiro-bifolio-holdout.yml'
  workflow_dispatch:

jobs:
  heldout-quiro-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen ZL EVA corpus
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt' \
            -o /tmp/voynich_eva.txt
      - name: Execute held-out manuscript-wide test
        run: |
          python research_gpt6/code/all_quires_bifolio_holdout.py \
            --corpus /tmp/voynich_eva.txt \
            --out research_gpt6/results/all_quires_bifolio_holdout.json \
            | tee /tmp/all-quiro.log
      - name: Execute blind held-out reconstruction
        run: |
          python research_gpt6/code/bifolio_blind_reconstruction.py \
            --corpus /tmp/voynich_eva.txt \
            --out research_gpt6/results/bifolio_blind_reconstruction.json \
            | tee /tmp/blind-reconstruction.log
      - name: Execute hand and Currier conditional control
        run: |
          python research_gpt6/code/bifolio_hand_currier_control.py \
            --corpus /tmp/voynich_eva.txt \
            --out research_gpt6/results/bifolio_hand_currier_control.json \
            | tee /tmp/hand-currier.log
      - name: Fetch independent Takahashi IT2a transcription
        run: |
          curl -L --fail --retry 3 \
            'https://www.voynich.nu/data/IT2a-n.txt' \
            -o /tmp/IT2a-n.txt
      - name: Execute IT2a blind replication
        run: |
          python research_gpt6/code/it2a_blind_bifolio_replication.py \
            --corpus /tmp/IT2a-n.txt \
            --out research_gpt6/results/it2a_blind_bifolio_replication.json \
            | tee /tmp/it2a-blind.log
      - name: Execute exact metadata-conditioned blind test
        run: |
          python research_gpt6/code/blind_reconstruction_metadata_conditional.py \
            --zl /tmp/voynich_eva.txt \
            --it /tmp/IT2a-n.txt \
            --out research_gpt6/results/blind_reconstruction_metadata_conditional.json \
            | tee /tmp/metadata-conditional.log
      - name: Execute distance and metadata double-residual reconstruction
        run: |
          python research_gpt6/code/bifolio_double_residual_reconstruction.py \
            --zl /tmp/voynich_eva.txt \
            --it /tmp/IT2a-n.txt \
            --out research_gpt6/results/bifolio_double_residual_reconstruction.json \
            | tee /tmp/double-residual.log
      - name: Execute leave-one-quire-out robustness audit
        run: |
          python research_gpt6/code/bifolio_leave_one_quire_out.py \
            --zl /tmp/voynich_eva.txt \
            --it /tmp/IT2a-n.txt \
            --out research_gpt6/results/bifolio_leave_one_quire_out.json \
            | tee /tmp/leave-one-quire-out.log
      - name: Execute quire C signal decomposition diagnostic
        run: |
          python research_gpt6/code/quire_c_signal_decomposition.py \
            --zl /tmp/voynich_eva.txt \
            --it /tmp/IT2a-n.txt \
            --out research_gpt6/results/quire_c_signal_decomposition.json \
            | tee /tmp/quire-c-decomposition.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-quiro-bifolio-holdout
          path: |
            research_gpt6/results/all_quires_bifolio_holdout.json
            research_gpt6/results/bifolio_blind_reconstruction.json
            research_gpt6/results/bifolio_hand_currier_control.json
            research_gpt6/results/it2a_blind_bifolio_replication.json
            research_gpt6/results/blind_reconstruction_metadata_conditional.json
            research_gpt6/results/bifolio_double_residual_reconstruction.json
            research_gpt6/results/bifolio_leave_one_quire_out.json
            research_gpt6/results/quire_c_signal_decomposition.json
          if-no-files-found: warn
