name: H66 aligned consensus labels
on:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/77_h66_aligned_consensus_preregistration.md'
      - 'research_gpt6/code/aligned_consensus_h66.py'
      - '.github/workflows/h66-aligned-consensus.yml'
  workflow_dispatch:
jobs:
  h66-aligned-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: curl -L --fail -o source_a.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - run: curl -L --fail -o source_b.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H66 aligned consensus test
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/aligned_consensus_h66.py \
            --source-a source_a.txt \
            --source-b source_b.txt \
            --out research_gpt6/results/aligned_consensus_h66.json \
            --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h66-aligned-consensus-results
          path: research_gpt6/results/aligned_consensus_h66.json
          if-no-files-found: error
