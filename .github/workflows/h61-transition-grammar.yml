name: H61 residual transition grammar
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/68_h61_residual_transition_grammar_preregistration.md'
      - 'research_gpt6/code/residual_transition_grammar_h61.py'
      - '.github/workflows/h61-transition-grammar.yml'
jobs:
  h61-residual-transition-grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Run preregistered H61 residual transition grammar
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/residual_transition_grammar_h61.py \
            --corpus voynich_eva.txt \
            --out research_gpt6/results/residual_transition_grammar_h61.json \
            --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h61-residual-transition-grammar-results
          path: research_gpt6/results/residual_transition_grammar_h61.json
          if-no-files-found: error
