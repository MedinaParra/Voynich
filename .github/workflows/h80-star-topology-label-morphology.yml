name: H80 star-topology label morphology
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/102_h80_star_topology_label_morphology_preregistration.md'
      - 'research_gpt6/code/h80_star_topology_label_morphology.py'
      - '.github/workflows/h80-star-topology-label-morphology.yml'

jobs:
  h80-star-topology-label-morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.4.6 scipy==1.17.1
      - name: Fetch frozen independent f68r1 star centres
        run: curl -L --fail -o f68r_star_centres.csv 'https://raw.githubusercontent.com/seeton/Voynich-public/8920f2e506fce4c2c5a1245fb21a312f25655f1b/analysis/annotations/f68r_star_centres.csv'
      - name: Fetch frozen Yale f68r1 coordinates
        run: curl -L --fail -o f68r1.json 'https://raw.githubusercontent.com/YaleDHLab/voynich/c4d36f4595292c92da8c7428e30cb23b700a019b/utils/voynichese/coords/f68r1.json'
      - name: Run preregistered H80 topology-morphology test
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h80_star_topology_label_morphology.py --stars f68r_star_centres.csv --yale f68r1.json --out research_gpt6/results/h80_star_topology_label_morphology.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h80-star-topology-label-morphology-results
          path: research_gpt6/results/h80_star_topology_label_morphology.json
          if-no-files-found: error
