name: Voynich directional ordering

on:
  push:
    branches:
      - research/gpt6-audit
    paths:
      - '.github/workflows/order-direction.yml'
      - 'research_gpt6/code/order_directional_boundaries.py'
      - 'research_gpt6/code/order_directional_sensitivity.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/gpt6-audit
          fetch-depth: 0

      - name: Fetch frozen ZL3b corpus
        run: |
          git clone https://github.com/cesarjz/Voynich.git /tmp/voynich-corpus
          cd /tmp/voynich-corpus
          git checkout 47e6a77dc9d5cd570c375f4aff710fa4a0567278
          test "$(git rev-parse HEAD)" = "47e6a77dc9d5cd570c375f4aff710fa4a0567278"

      - name: Run directional boundary benchmark
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/order_directional_boundaries.py \
            /tmp/voynich-corpus/corpus/voynich_eva.txt \
            --boundary-lines 12 \
            --json research_gpt6/results/order_directional_boundaries.json \
            > research_gpt6/results/order_directional_boundaries.stdout.json

      - name: Run directional sensitivity sweep
        run: |
          python research_gpt6/code/order_directional_sensitivity.py \
            /tmp/voynich-corpus/corpus/voynich_eva.txt \
            --json research_gpt6/results/order_directional_sensitivity.json \
            > research_gpt6/results/order_directional_sensitivity.stdout.json

      - name: Record provenance
        run: |
          {
            echo "workflow_commit=$(git rev-parse HEAD)"
            echo "corpus_commit=47e6a77dc9d5cd570c375f4aff710fa4a0567278"
            echo "python=$(python --version 2>&1)"
            sha256sum /tmp/voynich-corpus/corpus/voynich_eva.txt
            sha256sum research_gpt6/code/order_directional_boundaries.py
            sha256sum research_gpt6/code/order_directional_sensitivity.py
          } > research_gpt6/results/order_directional_provenance.txt

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_gpt6/results/order_directional_boundaries.json \
                  research_gpt6/results/order_directional_boundaries.stdout.json \
                  research_gpt6/results/order_directional_sensitivity.json \
                  research_gpt6/results/order_directional_sensitivity.stdout.json \
                  research_gpt6/results/order_directional_provenance.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: record directional ordering sensitivity"
            git push origin HEAD:research/gpt6-audit
          fi
