name: H85 f68r2 spatial label-length replication
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/111_h85_f68r2_spatial_label_length_replication_preregistration.md'
      - 'research_gpt6/code/h85_f68r2_spatial_label_length_replication.py'
      - '.github/workflows/h85-f68r2-spatial-label-length-replication.yml'

jobs:
  h85-f68r2-spatial-label-length-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen RN-Top f68r2 source
        run: curl -L --fail -o star_centres_f68r2_r3.csv 'https://raw.githubusercontent.com/RN-Top/Voynich/1eb6c0d1e98fb56acaadc0095c4d88a4a1c5bed0/analyses/star_centres_f68r2_r3.csv'
      - name: Fetch frozen independent f68r1 star centres
        run: curl -L --fail -o f68r_star_centres.csv 'https://raw.githubusercontent.com/seeton/Voynich-public/8920f2e506fce4c2c5a1245fb21a312f25655f1b/analysis/annotations/f68r_star_centres.csv'
      - name: Fetch frozen Yale f68r1 label source
        run: curl -L --fail -o f68r1.json 'https://raw.githubusercontent.com/YaleDHLab/voynich/c4d36f4595292c92da8c7428e30cb23b700a019b/utils/voynichese/coords/f68r1.json'
      - name: Run preregistered H85 test
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h85_f68r2_spatial_label_length_replication.py --f68r2-csv star_centres_f68r2_r3.csv --f68r1-centres f68r_star_centres.csv --f68r1-yale f68r1.json --out research_gpt6/results/h85_f68r2_spatial_label_length_replication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h85-f68r2-spatial-label-length-replication-results
          path: research_gpt6/results/h85_f68r2_spatial_label_length_replication.json
          if-no-files-found: error
