name: Kraken 7.1 real-page layout pilot

on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - 'research_gpt6/code/kraken_layout_pilot.py'
      - 'research_gpt6/code/test_kraken_layout_pilot.py'
      - 'research_gpt6/data/kraken_pilot_plan.json'
      - '.github/workflows/kraken-layout-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kraken-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU Torch
        run: python -m pip install --disable-pip-version-check 'torch==2.9.0' 'torchvision==0.24.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned Kraken and log resolved environment
        run: |
          python -m pip install --disable-pip-version-check 'kraken==7.1'
          python -m pip check
          python -m pip freeze
      - name: Compile and run scientific failure controls
        run: |
          python -m py_compile research_gpt6/code/kraken_layout_pilot.py research_gpt6/code/test_kraken_layout_pilot.py
          python research_gpt6/code/test_kraken_layout_pilot.py
      - name: Execute preregistered four-page pilot
        run: |
          python research_gpt6/code/kraken_layout_pilot.py \
            --plan research_gpt6/data/kraken_pilot_plan.json \
            --out research_gpt6/results/kraken_pilot
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-pilot-full-evidence
          path: research_gpt6/results/kraken_pilot/
          if-no-files-found: warn
          retention-days: 30
