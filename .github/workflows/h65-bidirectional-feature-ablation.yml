name: H65 bidirectional feature ablation
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/**'
      - '.github/workflows/h65-bidirectional-feature-ablation.yml'

jobs:
  h65-bidirectional-feature-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen ZL corpus
        run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Fetch frozen Takahashi corpus
        run: curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H65 bidirectional feature ablation
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h65_bidirectional_feature_ablation.py --zl voynich_eva.txt --takahashi IT2a-n.txt --out research_gpt6/results/h65_bidirectional_feature_ablation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h65-bidirectional-feature-ablation-results
          path: research_gpt6/results/h65_bidirectional_feature_ablation.json
          if-no-files-found: error
