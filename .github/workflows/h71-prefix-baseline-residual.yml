name: H71 exact-prefix baseline residual

on:
  pull_request:
    paths:
      - 'research_gpt6/85_h71_prefix_baseline_residual_preregistration.md'
      - 'research_gpt6/code/prefix_baseline_residual_h71.py'
      - '.github/workflows/h71-prefix-baseline-residual.yml'
  workflow_dispatch:

jobs:
  h71-prefix-baseline-residual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen source A
        run: curl -L --fail -o source_a.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Fetch frozen source B
        run: curl -L --fail -o source_b.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H71 exact-prefix residual test
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/prefix_baseline_residual_h71.py \
            --source-a source_a.txt \
            --source-b source_b.txt \
            --out research_gpt6/results/prefix_baseline_residual_h71.json \
            --permutations 999
      - uses: actions/upload-artifact@v4
        with:
          name: h71-prefix-baseline-residual-results
          path: research_gpt6/results/prefix_baseline_residual_h71.json
          if-no-files-found: error
