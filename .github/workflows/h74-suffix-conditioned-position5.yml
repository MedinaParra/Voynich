name: H74 suffix-conditioned position5

on:
  pull_request:
    paths:
      - 'research_gpt6/91_h74_suffix_conditioned_position5_preregistration.md'
      - 'research_gpt6/code/suffix_conditioned_position5_h74.py'
      - '.github/workflows/h74-suffix-conditioned-position5.yml'
  workflow_dispatch:

jobs:
  h74-suffix-conditioned-position5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen source A
        run: curl -L --fail -o source_a.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Fetch frozen source B
        run: curl -L --fail -o source_b.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H74 suffix-conditioned test
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/suffix_conditioned_position5_h74.py \
            --source-a source_a.txt \
            --source-b source_b.txt \
            --out research_gpt6/results/suffix_conditioned_position5_h74.json \
            --permutations 999
      - uses: actions/upload-artifact@v4
        with:
          name: h74-suffix-conditioned-position5-results
          path: research_gpt6/results/suffix_conditioned_position5_h74.json
          if-no-files-found: error
