name: H68 internal o/a residual
on:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/81_h68_internal_oa_preregistration.md'
      - 'research_gpt6/code/internal_oa_h68.py'
      - '.github/workflows/h68-internal-oa.yml'
  workflow_dispatch:
jobs:
  h68-internal-oa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: curl -L --fail -o source_a.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - run: curl -L --fail -o source_b.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run preregistered H68 internal o/a test
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/internal_oa_h68.py \
            --source-a source_a.txt \
            --source-b source_b.txt \
            --out research_gpt6/results/internal_oa_h68.json \
            --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h68-internal-oa-results
          path: research_gpt6/results/internal_oa_h68.json
          if-no-files-found: error
