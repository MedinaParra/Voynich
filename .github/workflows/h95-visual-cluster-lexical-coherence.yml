name: H95 visual-cluster lexical coherence
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/code/h95_visual_cluster_lexical_coherence.py'
      - '.github/workflows/h95-visual-cluster-lexical-coherence.yml'
jobs:
  h95:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow scipy scikit-learn
      - name: Run preregistered H95 confirmatory test
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/h95_visual_cluster_lexical_coherence.py --out research_gpt6/results/h95_visual_cluster_lexical_coherence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h95-visual-cluster-lexical-coherence
          path: research_gpt6/results/h95_visual_cluster_lexical_coherence.json
          if-no-files-found: error
