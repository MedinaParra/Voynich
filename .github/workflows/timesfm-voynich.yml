        with: {name: label-object-familywise-results, path: research_gpt6/results/label_object_familywise.json, if-no-files-found: error}
  independent-transcription-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
