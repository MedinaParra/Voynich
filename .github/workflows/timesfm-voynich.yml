name: Voynich frozen experiments
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths: ['research_gpt6/**','.github/workflows/timesfm-voynich.yml']
jobs:
  holistic-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Run frozen topology-from-text H1
        run: mkdir -p research_gpt6/results && python research_gpt6/code/topology_from_text.py --corpus voynich_eva.txt --out research_gpt6/results/topology_from_text.json --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: holistic-topology-results, path: research_gpt6/results/topology_from_text.json, if-no-files-found: error}
  lexical-anchor-length-matched:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - run: mkdir -p research_gpt6/results && python research_gpt6/code/label_pair_length_matched.py --corpus voynich_eva.txt --out research_gpt6/results/label_pair_length_matched.json --permutations 999
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: lexical-anchor-length-matched-results, path: research_gpt6/results/label_pair_length_matched.json, if-no-files-found: error}
