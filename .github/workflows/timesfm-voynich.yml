      - run: curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - run: curl -L --fail -o IT2a-n.txt 'https://raw.githubusercontent.com/oklo/voynich_gpt/2d7c61c387ad6962de730caf73c48612bc8f6957/IT2a-n.txt'
      - name: Run frozen independent-transcription topology replication
        run: mkdir -p research_gpt6/results && python research_gpt6/code/independent_transcription_topology.py --discovery voynich_eva.txt --replication IT2a-n.txt --out research_gpt6/results/independent_transcription_topology.json --permutations 999
