name: TimesFM Voynich experiment

on:
  workflow_dispatch:

jobs:
  timesfm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install TimesFM 3
        run: pip install 'timesfm[torch]'
      - name: Acquire pinned IVTFF corpus
        run: |
          curl -L --fail -o voynich_eva.txt 'https://raw.githubusercontent.com/cesarjz/Voynich/47e6a77dc9d5cd570c375f4aff710fa4a0567278/corpus/voynich_eva.txt'
      - name: Run Voynich TimesFM harness
        run: |
          mkdir -p research_gpt6/results
          python research_gpt6/code/timesfm_voynich.py --corpus voynich_eva.txt --out research_gpt6/results/timesfm_voynich.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timesfm-voynich-results
          path: research_gpt6/results/
          if-no-files-found: warn
