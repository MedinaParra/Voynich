name: H67 richer label-source admissibility
on:
  workflow_dispatch:
  pull_request:
    branches: [research/gpt6-audit]
    paths:
      - 'research_gpt6/**'
      - '.github/workflows/h67-richer-label-source-audit.yml'

jobs:
  h67-richer-label-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen external IVTFF candidate
        run: curl -L --fail -o IT_ivtff_1a.txt 'https://raw.githubusercontent.com/noah-chelednik/voynich-data/472ef7366606a799fc8f1044c037e06b413f6ddd/data_sources/cache/IT_ivtff_1a.txt'
      - name: Run preregistered H67 admissibility audit
        run: mkdir -p research_gpt6/results && python research_gpt6/code/h67_richer_label_source_audit.py --source IT_ivtff_1a.txt --out research_gpt6/results/h67_richer_label_source_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h67-richer-label-source-audit-results
          path: research_gpt6/results/h67_richer_label_source_audit.json
          if-no-files-found: error
