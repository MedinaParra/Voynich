name: Uniform local candidate reference v2 construction

on:
  push:
    branches: [experiment/kraken-voynich]
    paths:
      - 'research_gpt6/code/build_uniform_local_reference.py'
      - 'research_gpt6/data/local_reference_v2_plan.json'
      - '.github/workflows/voynichese-local-reference-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construct-versioned-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed geometric environment
        run: |
          python -m pip install --disable-pip-version-check -r research_gpt6/data/voynichese_registration_requirements.txt
          python -m pip check
      - name: Check shared numerical method
        run: python research_gpt6/code/test_local_residual_registration.py
      - name: Construct all four candidate pages from frozen validation evidence
        run: |
          python research_gpt6/code/build_uniform_local_reference.py \
            --plan research_gpt6/data/local_reference_v2_plan.json \
            --repo research_gpt6 \
            --out work/local_reference_v2
      - name: Preserve construction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-reference-v2
          path: work/local_reference_v2/
          if-no-files-found: warn
          retention-days: 30
